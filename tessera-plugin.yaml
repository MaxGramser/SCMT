# Manifest for SCMT (Simple Customizable Media Tile): an info tile and a button tile for a media_player entity.
id: scmt
version: 0.14.1
api: "0.10"
icon: music
maintainer: Schumey
license: MIT
stage: beta
topics: [media]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 5
permissions:
  # The tempo sensor chosen when the plugin was added (plugin.yaml reads it, for the tile's option "Extra lines").
  read_entities: ["{bpm}"]
  home_assistant_actions:
    - media_player.media_play_pause
    - media_player.media_next_track
    - media_player.media_previous_track
    - media_player.volume_up
    - media_player.volume_down
    - media_player.media_seek
    - media_player.volume_mute
    - media_player.volume_set
inputs:
  - { id: bpm, kind: entity, domains: [sensor], scope: screen, label: input_bpm, hint: input_bpm_hint }
tiles:
  - id: now_playing
    name: tile_name
    icon: music
    sizes: { min: 1x1, max: 4x4 }
    memory: 4700
    domains: [media_player]
    attributes: [media_title, media_artist, media_duration, media_position, media_position_updated_at, entity_picture, volume_level, is_volume_muted, media_album_name]
    pictures: 1
    example: tile_example
    preview: { title: "{media_title}" }
    options:
      - id: timeline
        kind: choice
        default: bar
        label: opt_timeline
        hint: opt_timeline_hint
        choices:
          - { value: "bar", label: tl_bar }
          - { value: "time", label: tl_time }
          - { value: "both", label: tl_both }
          - { value: "none", label: tl_none }
      - { id: bar_height, kind: number, min: 2, max: 16, step: 1, unit: px, default: 4, label: opt_barh, hint: opt_barh_hint }
      - id: bar_color
        kind: choice
        default: accent
        label: opt_bar_color
        hint: opt_bar_color_hint
        choices:
          - { value: "accent", label: bc_accent }
          - { value: "green", label: bc_green }
          - { value: "amber", label: bc_amber }
          - { value: "red", label: bc_red }
          - { value: "blue", label: bc_blue }
          - { value: "purple", label: bc_purple }
          - { value: "ink", label: bc_ink }
      - id: volume_display
        kind: choice
        default: change
        label: opt_voldisp
        hint: opt_voldisp_hint
        choices:
          - { value: "change", label: vd_change }
          - { value: "always", label: vd_always }
          - { value: "off", label: vd_off }
      - id: overlay
        kind: choice
        default: none
        label: opt_overlay
        hint: opt_overlay_hint
        choices:
          - { value: "none", label: ov_none }
          - { value: "volume", label: ov_volume }
          - { value: "pause", label: ov_pause }
          - { value: "both", label: ov_both }
      - id: text_size
        kind: choice
        default: medium
        label: opt_text_size
        hint: opt_text_size_hint
        choices:
          - { value: "small", label: ts_small }
          - { value: "medium", label: ts_medium }
          - { value: "large", label: ts_large }
      - { id: volume_bar, kind: toggle, default: false, label: opt_volbar, hint: opt_volbar_hint }
      # The extra lines under the artist; before 0.13.0 the toggles "album" and "bpm" (at most 12 options per tile).
      - id: album
        kind: choice
        default: none
        label: opt_extra
        hint: opt_extra_hint
        choices:
          - { value: "none", label: ex_none }
          - { value: "album", label: ex_album }
          - { value: "bpm", label: ex_bpm }
          - { value: "both", label: ex_both }
      - id: cover
        kind: choice
        default: left
        label: opt_cover
        hint: opt_cover_hint
        choices:
          - { value: "left", label: cs_left }
          - { value: "right", label: cs_right }
          - { value: "off", label: cs_off }
      - { id: cover_url, kind: text, label: opt_cover_url, hint: opt_cover_url_hint }
      - id: text_pos
        kind: choice
        default: middle
        label: opt_text_pos
        hint: opt_text_pos_hint
        choices:
          - { value: "middle", label: tp_middle }
          - { value: "top", label: tp_top }
          - { value: "bottom", label: tp_bottom }
      - id: buttons
        kind: choice
        default: none
        label: opt_buttons
        hint: opt_buttons_hint
        choices:
          - { value: "none", label: bt_none }
          - { value: "playback", label: bt_playback }
          - { value: "volume", label: bt_volume }
          - { value: "both", label: bt_both }
  - id: media_button
    name: button_tile_name
    icon: music
    sizes: { min: 1x1, max: 2x1 }
    memory: 300
    domains: [media_player]
    example: button_tile_example
    options:
      - id: action
        kind: choice
        default: play_pause
        label: opt_action
        hint: opt_action_hint
        choices:
          - { value: "previous", label: act_previous }
          - { value: "play_pause", label: act_play_pause }
          - { value: "next", label: act_next }
          - { value: "volume_up", label: act_volume_up }
          - { value: "volume_down", label: act_volume_down }
