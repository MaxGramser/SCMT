# Manifest for SCMT (Simple Customizable Media Tile): an info tile and a button tile for a media_player entity.
id: scmt
version: 0.7.0
api: "0.10"
icon: music
maintainer: Schumey
license: MIT
stage: beta
topics: [media]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

permissions:
  home_assistant_actions:
    - media_player.media_play_pause
    - media_player.media_next_track
    - media_player.media_previous_track
    - media_player.volume_up
    - media_player.volume_down
    - media_player.media_seek
    - media_player.volume_mute
    - media_player.volume_set

tiles:
  - id: now_playing
    name: tile_name
    icon: music
    sizes: { min: 1x1, max: 4x4 }
    memory: 3800
    domains: [media_player]
    attributes: [media_title, media_artist, media_duration, media_position, media_position_updated_at, entity_picture, volume_level, is_volume_muted, media_album_name]
    pictures: 1
    example: tile_example
    preview: { title: "{media_title}" }
    options:
      - id: timeline
        kind: choice
        default: bar
        label: opt_timeline
        hint: opt_timeline_hint
        choices:
          - { value: "bar", label: tl_bar }
          - { value: "time", label: tl_time }
          - { value: "both", label: tl_both }
          - { value: "none", label: tl_none }
      - { id: bar_height, kind: number, min: 2, max: 16, step: 1, unit: px, default: 4, label: opt_barh, hint: opt_barh_hint }
      - id: volume_display
        kind: choice
        default: change
        label: opt_voldisp
        hint: opt_voldisp_hint
        choices:
          - { value: "change", label: vd_change }
          - { value: "always", label: vd_always }
          - { value: "off", label: vd_off }
      - { id: volume_overlay, kind: toggle, default: false, label: opt_overlay, hint: opt_overlay_hint }
      - { id: seek, kind: toggle, default: false, label: opt_seek, hint: opt_seek_hint }
      - { id: mute, kind: toggle, default: false, label: opt_mute, hint: opt_mute_hint }
      - { id: volume_bar, kind: toggle, default: false, label: opt_volbar, hint: opt_volbar_hint }
      - { id: album, kind: toggle, default: false, label: opt_album, hint: opt_album_hint }
      - { id: cover, kind: toggle, default: true, label: opt_cover, hint: opt_cover_hint }
      - { id: controls, kind: toggle, default: false, label: opt_controls, hint: opt_controls_hint }
      - { id: volume, kind: toggle, default: false, label: opt_volume, hint: opt_volume_hint }

  - id: media_button
    name: button_tile_name
    icon: music
    sizes: { min: 1x1, max: 2x1 }
    memory: 300
    domains: [media_player]
    example: button_tile_example
    options:
      - id: action
        kind: choice
        default: play_pause
        label: opt_action
        hint: opt_action_hint
        choices:
          - { value: "previous", label: act_previous }
          - { value: "play_pause", label: act_play_pause }
          - { value: "next", label: act_next }
          - { value: "volume_up", label: act_volume_up }
          - { value: "volume_down", label: act_volume_down }
